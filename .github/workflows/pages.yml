# Publica el sitio (site/ + el simulador para Pyodide + gráficas de docs/) en GitHub Pages.
name: Sitio web

on:
  push:
    branches: [master]
    paths: ["site/**", "src/trafico/**", "docs/*.png", "scripts/sitio.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Armar el sitio
        run: bash scripts/sitio.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
